<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h2 align="center">Student Registration Form</h2>
    <hr>

    <!-- Form with method and action attributes -->
    <form method="post" action="submit.html">
        
        <p>
            <label><b>Full Name:</b></label> 
            <input type="text" name="fullname" placeholder="Enter your full name" required>
        </p>
        
        <p>
            <label><b>Email:</b></label> 
            <!-- Email validation handled by type="email" -->
            <input type="email" name="email" placeholder="Enter valid email address" required>
        </p>

        <p>
            <label><b>Password:</b></label> 
            <input type="password" name="password" placeholder="Enter password" required>
        </p>

        <p>
            <label><b>Gender:</b></label> 
            <input type="radio" id="male" name="gender" value="Male" required> 
            <label for="male">Male</label>
            
            <input type="radio" id="female" name="gender" value="Female"> 
            <label for="female">Female</label>
            
            <input type="radio" id="other" name="gender" value="Other"> 
            <label for="other">Other</label>
        </p>

        <p>
            <label><b>Course:</b></label>
            <select name="course" required>
                <option value="">--Select Course--</option>
                <option value="btech">B.Tech</option>
                <option value="bca">BCA</option>
                <option value="mca">MCA</option>
            </select>
        </p>

        <p>
            <label><b>Contact No:</b></label> 
            <input type="tel" name="contact" placeholder="Enter phone number" required>
        </p>

        <p>
            <label><b>Address:</b></label><br>
            <textarea name="address" rows="4" cols="35" placeholder="Enter your address" required></textarea>
        </p>

        <p>
            <button type="submit">Register</button>
            <button type="reset">Clear</button>
        </p>

    </form>

    <hr>
    <p align="center">&copy; 2025 Student Registration Portal</p>

</body>
</html>
